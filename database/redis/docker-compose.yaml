version: "3.9"

services:
  redis:
    image: redis:alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    command:
      - redis-server
    volumes:
      # Redis 数据目录（等价于 /data volume）
      - ~/.docker_data/redis:/data
    networks:
      - common

networks:
  common:
    external: true
